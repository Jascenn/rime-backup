name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Shell syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Check Homebrew formula
        run: ruby -c homebrew/Formula/rimebak.rb

      - name: Check whitespace
        run: git diff --check
